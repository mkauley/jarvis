services:
  # Portainer — web UI for managing Docker containers, images and volumes
  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    restart: always
    ports:
      - "9001:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - backend

  # Ollama — runs local LLMs on the GPU; the AI brain behind JARVIS and Open WebUI
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - backend

  # Home Assistant — smart home hub; runs automations and the voice assistant pipeline
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /mnt/nas/docker/ha-config:/config
    security_opt:
      - label=disable

  # Whisper (Wyoming) — speech-to-text for Home Assistant voice commands
  whisper:
    image: rhasspy/wyoming-whisper
    container_name: whisper
    restart: unless-stopped
    ports:
      - "10300:10300"
    volumes:
      - /mnt/nas/docker/whisper:/data
    command: --model base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - backend

  # openWakeWord (Wyoming) — listens for the wake word to start a voice command
  wyoming-openwakeword:
    image: rhasspy/wyoming-openwakeword
    container_name: wyoming-openwakeword
    restart: unless-stopped
    ports:
      - "10400:10400"
    volumes:
      - /mnt/nas/docker/openwakeword:/data
    networks:
      - backend

  # Piper (Wyoming) — fast text-to-speech for Home Assistant voice replies
  wyoming-piper:
    image: rhasspy/wyoming-piper
    container_name: wyoming-piper
    restart: unless-stopped
    ports:
      - "10200:10200"
    volumes:
      - /mnt/nas/docker/piper:/data
    command: --voice en_US-lessac-medium
    networks:
      - backend

  # Coqui TTS — higher-quality neural text-to-speech server (GPU)
  coqui-tts:
    image: ghcr.io/coqui-ai/tts
    container_name: coqui-tts
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - /mnt/nas/docker/coqui-tts:/root/.local/share/tts
    entrypoint: tts-server
    command: --model_name tts_models/en/ljspeech/tacotron2-DDC --port 5002
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - backend

  # Fooocus — Stable Diffusion image generation UI; on-demand, shares VRAM with Ollama
  fooocus:
    image: ghcr.io/lllyasviel/fooocus
    container_name: fooocus
    restart: no
    ports:
      - "7865:7865"
    volumes:
      - /mnt/nas/docker/fooocus/models:/content/app/models
      - /mnt/nas/docker/fooocus/outputs:/content/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - backend

  # OctoPrint — web control for the 3D printer over USB (disabled)
#  octoprint:
#    image: octoprint/octoprint
#    container_name: octoprint
#    restart: unless-stopped
#    ports:
#      - "5000:5000"
#    volumes:
#      - /mnt/nas/docker/octoprint:/octoprint
#    devices:
#      - /dev/ttyUSB0:/dev/ttyUSB0
#    networks:
#      - backend

  # Syncthing — peer-to-peer file sync; hub for the novelWriter projects
  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    hostname: jarvis
    network_mode: host          # 8384 GUI, 22000 tcp/udp sync, 21027 udp discovery
    environment:
      - PUID=1000               # mkeph
      - PGID=1000
    volumes:
      - /mnt/nas/docker/syncthing:/var/syncthing/config
      - /mnt/nas/sync:/var/syncthing/Sync
    restart: unless-stopped

  # Open WebUI — ChatGPT-style web chat interface for the Ollama models
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - /mnt/nas/docker/open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - backend

  # MariaDB — database backing Nextcloud
  nextcloud-db:
    image: mariadb:10.11
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=N!14N0v3mb3rM1k3!M
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=N!14N0v3mb3rM1k3!M
    volumes:
      - /mnt/nas/docker/nextcloud-db:/var/lib/mysql
    networks:
      - backend

  # Nextcloud — self-hosted cloud storage (files, Google Drive mirror)
  nextcloud:
    image: nextcloud
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - nextcloud_app:/var/www/html
      - /mnt/nas/docker/nextcloud:/var/www/html/data
      - /mnt/nas/docker/gdrive:/mnt/gdrive
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=N!14N0v3mb3rM1k3!M
      - NEXTCLOUD_TRUSTED_DOMAINS=192.168.50.200
    depends_on:
      - nextcloud-db
    networks:
      - backend

networks:
  backend:

volumes:
  portainer_data:
  ollama_models:
  nextcloud_app:
